name: Update and build PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag, or commit
        required: true
        default: main
        type: string
      publish:
        description: Publish a new release if the book or PDF pipeline changed
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      upstream_commit: ${{ steps.resolve.outputs.upstream_commit }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Resolve upstream revision and content fingerprint
        id: resolve
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          if [[ -n "$UPSTREAM_REF" ]]; then
            python build.py --resolve-only --ref "$UPSTREAM_REF"
          else
            python build.py --resolve-only
          fi
      - name: Skip an already published revision
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true ]] && gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo 'No book or PDF pipeline changes since this release.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo "should_publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          fi
      - name: Install PDF system dependencies
        timeout-minutes: 5
        if: steps.check.outputs.build == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo -E apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-noto-core
      - name: Install Python dependencies
        if: steps.check.outputs.build == 'true'
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        if: steps.check.outputs.build == 'true'
        timeout-minutes: 5
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        # ubuntu-24.04 already supplies Chromium's shared libraries.
        run: python -m playwright install chromium
      - name: Build and audit the complete book
        if: steps.check.outputs.build == 'true'
        run: python build.py --reuse-source --review
      - name: Upload PDF and provenance
        if: steps.check.outputs.build == 'true' && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpsat-primer-pdf
          path: output/pdf/
          if-no-files-found: error
          retention-days: 30
      - name: Upload layout review and diagnostics
        if: always() && steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-review
          path: |
            build/review/
            build/build.log
            build/build-report.json
            build/geometry.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cpsat-primer-pdf
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
        run: |
          cd release
          BUILD_DATE=$(python3 -c 'import json; print(json.load(open("build-info.json"))["built_at"][:10])')
          UPSTREAM_DATE=$(python3 -c 'import json; print(json.load(open("build-info.json"))["upstream_commit_date"])')
          cat > release-notes.md <<EOF
          Unofficial US Letter PDF edition of **The CP-SAT Primer** by Dominik Krupke and contributors.

          PDF build date: $BUILD_DATE (UTC).
          Upstream revision date: $UPSTREAM_DATE.

          Upstream source: [$UPSTREAM_COMMIT](https://github.com/d-krupke/cpsat-primer/commit/$UPSTREAM_COMMIT).

          Book: CC BY 4.0. See NOTICE.md and licenses.zip for attribution and third-party terms.
          Build provenance and automated audit results are attached.
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "The CP-SAT Primer — Letter PDF · $BUILD_DATE" \
            --notes-file release-notes.md \
            cpsat-primer-letter.pdf build-info.json audit.json NOTICE.md licenses.zip
